version: 2
updates:
  # api runtime deps (requirements.txt)
  - package-ecosystem: "pip"
    directory: "/api"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3 # don't open a PR until a release is ≥3 days old (supply-chain)
    groups:
      api:
        patterns: ["*"]
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 5

  # web deps (pnpm-lock.yaml) — complements the pnpm minimumReleaseAge (3 days)
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3
    groups:
      web:
        patterns: ["*"]
    labels: ["dependencies"]
    commit-message:
      prefix: "deps(web)"
    open-pull-requests-limit: 5

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci"
    open-pull-requests-limit: 5
