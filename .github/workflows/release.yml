name: release

# Cuts a release Wednesday evening, but ONLY when there are changes since the last
# release. Version = yyyy.adrcount.commitcount (year . #ADRs in docs/decisions .
# total commit count), so any new commit yields a new version; no new commits since
# the last tag ⇒ same version ⇒ already tagged ⇒ skip. Builds + pushes the one-image
# container to GHCR and publishes a GitHub release.

on:
  schedule:
    - cron: "0 18 * * 3" # Wednesday 18:00 UTC (evening)
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for commit count + existing tags

      - name: Compute version
        id: v
        run: |
          YEAR=$(date -u +%Y)
          ADRS=$(ls docs/decisions/[0-9]*.md 2>/dev/null | wc -l | tr -d ' ')
          COMMITS=$(git rev-list --count HEAD)
          VERSION="${YEAR}.${ADRS}.${COMMITS}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "No changes since v$VERSION — skipping release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Releasing v$VERSION (year=$YEAR adrs=$ADRS commits=$COMMITS)."
          fi

      - name: Log in to GHCR
        if: steps.v.outputs.exists == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        if: steps.v.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository }}:latest

      - name: Tag & GitHub release
        if: steps.v.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag "v${{ steps.v.outputs.version }}"
          git push origin "v${{ steps.v.outputs.version }}"
          gh release create "v${{ steps.v.outputs.version }}" \
            --title "v${{ steps.v.outputs.version }}" --generate-notes
