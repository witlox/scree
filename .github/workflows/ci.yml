name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"  # nightly @contract run (boundary-fidelity drift detection)
  workflow_dispatch:

jobs:
  nightly-changes:
    # The nightly heartbeat must actually test something new. Compares the commit
    # under test against the last green scheduled run's commit; when they match
    # there is nothing new to verify and the test jobs skip (the same
    # "no changes since last release ⇒ skip" pattern release.yml uses). PR/push
    # runs always carry a new commit, so the gate passes them through unchanged.
    name: nightly-changes (gate)
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Check for changes since last green nightly
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Not a scheduled run — gate passes through."
            exit 0
          fi
          LAST_SHA=$(gh api "/repos/${{ github.repository }}/actions/workflows/ci.yml/runs?event=schedule&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty' || echo "")
          THIS_SHA="${{ github.sha }}"
          if [ -n "$LAST_SHA" ] && [ "$LAST_SHA" = "$THIS_SHA" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new commits since the last green nightly ($LAST_SHA) — the test jobs skip."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            if [ -z "$LAST_SHA" ]; then
              echo "No green nightly on record yet — bootstrap run."
            else
              echo "New commits since $LAST_SHA — the nightly runs the full suite."
            fi
          fi

  api-tests:
    name: api-tests
    needs: nightly-changes
    if: needs.nightly-changes.outputs.changed != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: uv + pytest (@api / unit)
        working-directory: api
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv venv --python 3.13
          uv pip install -r requirements.txt -r requirements-ci.txt
          .venv/bin/pytest -q

  bdd:
    name: bdd (@api scenarios)
    # The pytest-bdd Gherkin scenarios (api/tests/features) also run inside api-tests;
    # this surfaces them as their own visible/required check. (@e2e browser BDD: #97.)
    needs: nightly-changes
    if: needs.nightly-changes.outputs.changed != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: uv + pytest -m api
        working-directory: api
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv venv --python 3.13
          uv pip install -r requirements.txt -r requirements-ci.txt
          .venv/bin/pytest -q -m api

  contract-tests:
    name: contract-tests
    # G-B1: the @contract tier boots real services (Keycloak/OpenFGA/Vault) via
    # testcontainers to catch stub-vs-real drift — including the canonical @contract
    # gherkin (e.g. crypto-shred against a real Vault). Runs on every PR/push (GitHub
    # runners have Docker); the schedule keeps a nightly heartbeat. GitLab @contract
    # tests still skip unless GITLAB_TEST_URL/GITLAB_TEST_TOKEN are provided.
    needs: nightly-changes
    if: needs.nightly-changes.outputs.changed != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: uv + pytest (@contract)
        working-directory: api
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv venv --python 3.13
          uv pip install -r requirements.txt -r requirements-ci.txt testcontainers
          .venv/bin/pytest -q -m contract

  web-tests:
    name: web-tests
    needs: nightly-changes
    if: needs.nightly-changes.outputs.changed != 'false'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  web-e2e:
    name: web-e2e (@e2e journeys)
    # Drives the real feature islands in a browser against the canonical *.feature
    # @e2e scenarios (Playwright across desktop + mobile; API is route-mocked).
    needs: nightly-changes
    if: needs.nightly-changes.outputs.changed != 'false'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
